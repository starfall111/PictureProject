spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: localhost
      port: 6379
      database: 5
      password: "125801"
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 200ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picture
    username: root
    password: 125801
  session:
    timeout: 2592000                    # Session 过期时间
    store-type: redis               # 存储类型
    redis:
      namespace: "myapp:session"    # Redis key 前缀
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:125801}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: 5          # 核心消费者数
        max-concurrency: 15     # 峰期最多扩到 15
        prefetch: 1             # 每个消费者一次只取 1 条，防止某个消费者积压
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:1824109129@qq.com}
    password: ${MAIL_PASSWORD:mdotctsxusxhbeih}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
mybatis-plus:
  configuration:
    # Mybatis-plus 配置
    map-underscore-to-camel-case: false
    #日志输出（开发阶段）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1 # 逻辑已删除（默认为1）
      logic-not-delete-value: 0 # 逻辑未删除（默认为0）
  mapper-locations: classpath*:mapper/*.xml
