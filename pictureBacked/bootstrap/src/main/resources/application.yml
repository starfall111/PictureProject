# ==================== 限流配置 ====================
# 三级优先级：注解显式指定（非 -1）> rules 按 resource 匹配 > 全局默认
# 修改后需重启生效（Phase 2 不支持热更新）
ratelimit:
  default-window-seconds: 60
  default-max-attempts: 100
  default-fallback: FAIL_OPEN
  rules:
    # ===== 关键接口（注解显式值优先，此处仅文档化，便于运维一目了然）=====
    # login:      60s / 10  （UserController.login，显式阈值，防爆破）
    # notice.verify: 60s / 1 （NoticeController.sendVerificationCode，显式阈值，防短信轰炸）
    # seckill.grab: 10s / 1  （SeckillController.grab，显式阈值 + FAIL_CLOSE，防超卖/刷券）
    - resource: "login"
      window-seconds: 60
      max-attempts: 10
    - resource: "notice.verify"
      window-seconds: 60
      max-attempts: 1
    - resource: "seckill.grab"
      window-seconds: 10
      max-attempts: 1

    # ===== 用户模块 =====
    - resource: "user.register"
      window-seconds: 60
      max-attempts: 3
    - resource: "user.get"
      window-seconds: 60
      max-attempts: 60
    - resource: "user.update"
      window-seconds: 60
      max-attempts: 10
    - resource: "user.avatar"
      window-seconds: 60
      max-attempts: 5

    # ===== 用户模块（补充：安全敏感写操作）=====
    - resource: "user.password"
      window-seconds: 60
      max-attempts: 5
    - resource: "user.bind"
      window-seconds: 60
      max-attempts: 5

    # ===== 图片模块 =====
    - resource: "picture.upload"
      window-seconds: 60
      max-attempts: 10
    - resource: "picture.uploadUrl"
